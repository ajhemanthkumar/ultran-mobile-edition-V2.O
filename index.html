
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRAN AI</title>

<style>
body {
    background: black;
    color: cyan;
    text-align: center;
    font-family: Arial;
}

h1 {
    letter-spacing: 8px;
    text-shadow: 0 0 15px cyan;
}

.core {
    width: 240px;
    height: 240px;
    margin: 50px auto;
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.arc {
    fill: none;
    stroke: #00ffff;
    stroke-width: 5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 7px cyan);
}

.arc2 {
    stroke: #0088ff;
    stroke-width: 6;
}

.arc3 {
    stroke: #00ffff;
    stroke-width: 4;
}

.center {
    fill: cyan;
    filter: drop-shadow(0 0 12px cyan);
}

</style>
</head>

<body>

<h1>ULTRAN</h1>
<p>PERSONAL AI SYSTEM</p>

<div class="core">

<svg viewBox="0 0 200 200">

<g id="ring1">
    <circle class="arc"
    cx="100" cy="100" r="90"
    stroke-dasharray="120 35 65 35 100 210"/>
</g>

<g id="ring2">
    <circle class="arc arc2"
    cx="100" cy="100" r="70"
    stroke-dasharray="100 45 65 230"/>
</g>

<g id="ring3">
    <circle class="arc arc3"
    cx="100" cy="100" r="49"
    stroke-dasharray="60 35 50 35 60 70"/>
</g>

<circle class="center"
cx="100" cy="100" r="18"/>

</svg>
</div>

<h3>CORE ACTIVE</h3>

<script>

let angle1 = 0;
let angle2 = 0;
let angle3 = 0;

function animateCore() {

    angle1 += 2;
    angle2 -= 3;
    angle3 += 5;

    document.getElementById("ring1")
    .setAttribute("transform",
    "rotate(" + angle1 + " 100 100)");

    document.getElementById("ring2")
    .setAttribute("transform",
    "rotate(" + angle2 + " 100 100)");

    document.getElementById("ring3")
    .setAttribute("transform",
    "rotate(" + angle3 + " 100 100)");

    requestAnimationFrame(animateCore);
}

animateCore();

</script>

</body>
</html>
