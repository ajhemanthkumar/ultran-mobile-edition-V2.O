
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRAN AI SYSTEM</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 15px;
  background: #000;
  color: #00ffff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 480px;
  margin: auto;
  text-align: center;
}

h1 {
  font-size: 38px;
  letter-spacing: 9px;
  text-shadow: 0 0 15px cyan;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 14px;
  letter-spacing: 3px;
}

/* REACTOR */

.core {
  width: 210px;
  height: 210px;
  position: relative;
  margin: 55px auto 35px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 5px dashed cyan;
  box-shadow: 0 0 12px cyan;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.ring1 {
  width: 210px;
  height: 210px;
  border-color: cyan;
  border-left-color: transparent;
  animation: spin 4s linear infinite;
}

.ring2 {
  width: 155px;
  height: 155px;
  border-style: solid;
  border-color: #008cff;
  border-bottom-color: transparent;
  animation: reverse-spin 3s linear infinite;
}

.ring3 {
  width: 105px;
  height: 105px;
  border-color: cyan;
  animation: spin 2s linear infinite;
}

.center {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: cyan;
  box-shadow: 0 0 25px cyan;
  animation: glow 1s infinite alternate;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes reverse-spin {
  to { transform: rotate(-360deg); }
}

@keyframes glow {
  from { opacity: .5; }
  to { opacity: 1; }
}

.core-active {
  font-size: 23px;
  font-weight: bold;
  text-shadow: 0 0 12px cyan;
  margin-bottom: 35px;
}

/* PANELS */

.panel {
  border: 1px solid #007d85;
  background: #020a0c;
  padding: 15px;
  margin: 18px 0;
  text-align: left;
  box-shadow: 0 0 10px #003b40;
}

.panel-title {
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 15px;
  color: cyan;
  border-bottom: 1px solid #00565b;
  padding-bottom: 10px;
}

.status-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin: 15px 0;
  color: #a0ffff;
}

.online {
  color: #00ff66;
}

.locked {
  color: #ff4545;
}

/* CHAT */

.chat {
  height: 230px;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #007d85;
  background: #000;
  font-size: 13px;
  text-align: left;
  line-height: 1.6;
}

.ai-message {
  color: cyan;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.user-message {
  color: white;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

/* INPUT */

.input-area {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  background: #020a0c;
  border: 1px solid cyan;
  color: cyan;
  outline: none;
}

button {
  padding: 12px 16px;
  background: cyan;
  color: black;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: white;
}

/* QUICK BUTTONS */

.quick-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.quick-buttons button {
  flex: 1;
  min-width: 90px;
  font-size: 11px;
  background: #003b40;
  border: 1px solid cyan;
  color: cyan;
}

/* FOOTER */

.footer {
  margin: 25px 0;
  font-size: 10px;
  color: #007b80;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

<h1>ULTRAN</h1>
<div class="subtitle">PERSONAL AI SYSTEM</div>

<!-- ROTATING CORE -->

<div class="core">
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>
  <div class="center"></div>
</div>

<div class="core-active">CORE ACTIVE</div>

<!-- SYSTEM STATUS -->

<div class="panel">

<div class="panel-title">SYSTEM STATUS</div>

<div class="status-row">
AI CORE <span class="online">● ONLINE</span>
</div>

<div class="status-row">
NETWORK <span class="online">● ONLINE</span>
</div>

<div class="status-row">
VOICE <span class="locked">● LOCKED</span>
</div>

<div class="status-row">
MEMORY <span class="locked">● LOCKED</span>
</div>

<div class="status-row">
SECURITY <span class="online">● ACTIVE</span>
</div>

</div>

<!-- AI OUTPUT -->

<div class="panel">

<div class="panel-title">ULTRAN AI OUTPUT</div>

<div class="chat" id="chat">

<div class="ai-message">
ULTRAN: SYSTEM INITIALIZED.
</div>

<div class="ai-message">
ULTRAN: CORE ONLINE.
</div>

<div class="ai-message">
ULTRAN: NETWORK READY.
</div>

<div class="ai-message">
ULTRAN: WELCOME BOSS.
</div>

</div>

<!-- MESSAGE INPUT -->

<div class="input-area">

<input
id="message"
type="text"
placeholder="Enter your command..."
>

<button onclick="sendMessage()">SEND</button>

</div>

<!-- QUICK ACTIONS -->

<div class="quick-buttons">

<button onclick="command('SYSTEM STATUS')">
STATUS
</button>

<button onclick="command('HELLO ULTRAN')">
HELLO
</button>

<button onclick="command('TIME')">
TIME
</button>

</div>

</div>

<div class="footer">
ULTRAN PERSONAL AI SYSTEM
<br><br>
ALL SYSTEMS MONITORED
</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("message");

function addMessage(type, text) {
  const div = document.createElement("div");
  div.className = type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function command(msg) {
  input.value = msg;
  sendMessage();
}

function sendMessage() {

  let msg = input.value.trim();

  if (msg === "") return;

  addMessage("user-message", "YOU: " + msg);

  let answer = "COMMAND RECEIVED. AI BACKEND NOT CONNECTED.";

  let lower = msg.toLowerCase();

  if (lower.includes("hello")) {
    answer = "HELLO BOSS. ULTRAN SYSTEM IS ONLINE.";
  }

  else if (lower.includes("status")) {
    answer = "CORE ONLINE. NETWORK ONLINE. SECURITY ACTIVE.";
  }

  else if (lower.includes("time")) {
    answer = "CURRENT TIME: " +
      new Date().toLocaleTimeString();
  }

  setTimeout(() => {
    addMessage("ai-message", "ULTRAN: " + answer);
  }, 400);

  input.value = "";
}

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});

</script>

</body>
</html>
