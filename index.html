<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRAN AI</title>

<style>
body {
    background: black;
    color: cyan;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 30px;
    letter-spacing: 8px;
    text-shadow: 0 0 15px cyan;
}

.ultran-core {
    width: 220px;
    height: 220px;
    position: relative;
    margin: 60px auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ultran-ring {
    position: absolute;
    border-radius: 50%;
    border: 5px dashed cyan;
    box-shadow: 0 0 12px cyan;
    animation-timing-function: linear !important;
    animation-iteration-count: infinite !important;
    animation-play-state: running !important;
    will-change: transform;
}

.ultran-orbit-a {
    width: 210px;
    height: 210px;
    border-top-color: cyan;
    border-bottom-color: #0066ff;
    border-left-color: transparent;
    animation: ultran-spin-a 3s linear infinite !important;
}

.ultran-orbit-b {
    width: 160px;
    height: 160px;
    border-style: solid;
    border-top-color: #0088ff;
    border-bottom-color: transparent;
    animation: ultran-spin-b 2s linear infinite !important;
}

.ultran-orbit-c {
    width: 110px;
    height: 110px;
    border-style: dashed;
    border-color: cyan;
    animation: ultran-spin-a 1s linear infinite !important;
}

.ultran-center {
    width: 35px;
    height: 35px;
    background: cyan;
    border-radius: 50%;
    box-shadow: 0 0 20px cyan, 0 0 50px cyan;
    animation: ultran-glow 1s ease-in-out infinite alternate;
}

@keyframes ultran-spin-a {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes ultran-spin-b {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes ultran-glow {
    from { opacity: 0.4; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<h1>ULTRAN</h1>
<p>PERSONAL AI SYSTEM</p>

<div class="ultran-core">
    <div class="ultran-ring ultran-orbit-a"></div>
    <div class="ultran-ring ultran-orbit-b"></div>
    <div class="ultran-ring ultran-orbit-c"></div>
    <div class="ultran-center"></div>
</div>

<h3>CORE ACTIVE</h3>

</body>
</html>
